controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - arm_joint1
      - arm_joint2
      - arm_joint3
      - arm_joint4
      - arm_joint5
      - arm_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      arm_joint1: {trajectory: 0.2, goal: 0.1}
      arm_joint2: {trajectory: 0.2, goal: 0.1}
      arm_joint3: {trajectory: 0.2, goal: 0.1}
      arm_joint4: {trajectory: 0.2, goal: 0.1}
      arm_joint5: {trajectory: 0.2, goal: 0.1}
      arm_joint6: {trajectory: 0.2, goal: 0.1}
