cyx_motion_server:
  ros__parameters:
    planning_group: cyx_arm
    default_end_effector_link: tool0
    default_reference_frame: base_link
    default_planner_id: RRTConnectkConfigDefault
    planning_time: 5.0
    planning_attempts: 5
    velocity_scaling: 0.2
    acceleration_scaling: 0.2
    allowed_start_tolerance: 0.05
    state_timeout: 1.0
    cartesian_eef_step: 0.005
    cartesian_minimum_fraction: 0.98
    jog_step_size: 0.010
    jog_eef_step: 0.002
    jog_minimum_fraction: 0.99
    plan_cache_size: 10
    plan_cache_timeout: 300.0
